<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>City Simulator PWA Engine</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="ui-container">
        <div id="debug-panel">
            <h3>Engine Controls</h3>
            <div style="margin-bottom: 8px; display: flex; gap: 4px;">
                <button class="sys-btn speed-btn" data-speed="PAUSED" title="Pause Loops">‖ PAUSE</button>
                <button class="sys-btn speed-btn active" data-speed="NORMAL" title="Normal 4Hz">1x</button>
                <button class="sys-btn speed-btn" data-speed="HYPER" title="Fast-Forward 20Hz">4x >></button>
            </div>
            <button id="reset-game-btn" class="sys-btn" style="width: 100%; color: #ff3333; border-color: #aa2222; margin-bottom: 8px;" title="Purge Core State Matrix">⚠️ RESET ENGINE</button>

            <h3 style="margin-top: 12px;">Market Demand (RCI)</h3>
            <div style="font-family: monospace; font-size: 11px; background: #050a05; border: 1px solid #004400; padding: 6px; border-radius: 3px; line-height: 1.4;">
                <div style="display: flex; align-items: center;">
                    <span style="color: #00ff00; width: 15px; font-weight: bold;">R:</span>
                    <span id="r-demand-bar" style="color: #00ff00; letter-spacing: 1px;">▱▱▱▱▱▱▱▱▱▱</span>
                </div>
                <div style="display: flex; align-items: center;">
                    <span style="color: #3388ff; width: 15px; font-weight: bold;">C:</span>
                    <span id="c-demand-bar" style="color: #3388ff; letter-spacing: 1px;">▱▱▱▱▱▱▱▱▱▱</span>
                </div>
                <div style="display: flex; align-items: center;">
                    <span style="color: #ffff00; width: 15px; font-weight: bold;">I:</span>
                    <span id="i-demand-bar" style="color: #ffff00; letter-spacing: 1px;">▱▱▱▱▱▱▱▱▱▱</span>
                </div>
            </div>

            <h3 style="margin-top: 12px;">Diagnostic Data</h3>
            <div>FPS: <span id="fps-val">0</span></div>
            <div>Sim Ticks: <span id="tick-val">0</span></div>
            <div>Funds: $<span id="funds-val">0</span></div>
            <div>Active Tool: <span id="tool-val">None</span></div>
            <hr style="border:0; border-top: 1px solid #004400; margin: 8px 0;">
            <button id="toggle-view-btn" class="sys-btn" style="width:100%;">VIEW: CITY GRID</button>
        </div>

        <div id="toolbar">
            <button class="tool-btn" data-tool="RESIDENTIAL" title="Residential Zone ($100)">R</button>
            <button class="tool-btn" data-tool="COMMERCIAL" title="Commercial Zone ($100)">C</button>
            <button class="tool-btn" data-tool="INDUSTRIAL" title="Industrial Zone ($100)">I</button>
            <button class="tool-btn" data-tool="ROAD" title="Road Network ($20)">Road</button>
            <button class="tool-btn" data-tool="POWER_LINE" title="Power Line ($5)">Wire</button>
            <button class="tool-btn" data-tool="POWER_PLANT" title="Coal Power Plant ($3000)">Plant</button>
            <button class="tool-btn" data-tool="BULLDOZER" title="Bulldozer Demolish ($1)">Clear</button>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script type="module" src="js/main.js"></script>
</body>
</html>

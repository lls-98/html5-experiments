<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML5 Experiments</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <div id="main-menu" class="menu-card">
        <h1>Main Menu</h1>
        <button id="newGameBtn" class="menu-btn success">New Game</button>
        <label for="loadInputMainMenu" class="menu-btn info file-label">Load Game</label>
        <input type="file" id="loadInputMainMenu" accept=".json" style="display: none;">
    </div>

    <div id="generator-menu" class="menu-card hidden">
        <h2>Map Generator</h2>
        
        <div class="input-group">
            <label for="mapSizeInput">Map Size (Tiles):</label>
            <input type="number" id="mapSizeInput" value="30" min="10" max="100">
        </div>

        <div class="input-group">
            <label for="mapTypeInput">Terrain Theme:</label>
            <select id="mapTypeInput">
                <option value="plain">Plain Grasslands</option>
                <option value="river">Winding River</option>
                <option value="coastal">Coast</option>
                <option value="lake">Central Lake</option>
            </select>
        </div>

        <div class="btn-row">
            <button id="backToMenuBtn" class="menu-btn danger">Back</button>
            <button id="generateMapBtn" class="menu-btn success">Generate Map</button>
        </div>
    </div>

    <div id="game-container" class="hidden">
        
        <div id="editor-toolbar">
            <div id="terrain-phase-controls" class="toolbar-group">
                <span class="phase-badge terrain">Terrain Mode</span>
                <button id="saveMapBtn" class="tool-btn">Save Map</button>
                <button id="switchToBuildBtn" class="tool-btn success-btn">Build City!</button>
            </div>

            <div id="build-phase-controls" class="toolbar-group hidden">
                <span class="phase-badge simulation">Simulation Mode</span>
                <button id="saveGameBtn" class="tool-btn">Save City</button>
            </div>
        </div>

        <div id="terrain-sidebar">
            <h3>Terrain Brushes</h3>
            <button class="brush-btn active" data-type="empty">Grass</button>
            <button class="brush-btn" data-type="water">Water</button>
            <button class="brush-btn" data-type="forest">Forest</button>
            <button class="brush-btn" data-type="sand">Sand</button>
            <button class="brush-btn" data-type="mountain">Mountain</button>
        </div>
        
    <div id="build-sidebar" class="hidden">
        <h3>City Menu</h3>
        
        <button class="menu-category-btn" data-tool="bulldozer">Bulldozer</button>
        <button class="menu-category-btn" data-tool="query">Query</button>
        
        <hr class="menu-divider">

        <div class="category-wrapper">
            <button class="menu-category-btn dropdown-trigger">Zoning <span>▶</span></button>
            <div class="submenu-panel">
                <button class="build-btn" data-tool="residential">Residential</button>
                <button class="build-btn" data-tool="commercial">Commercial</button>
                <button class="build-btn" data-tool="industrial">Industrial</button>
            </div>
        </div>

        <div class="category-wrapper">
            <button class="menu-category-btn dropdown-trigger">Roads <span>▶</span></button>
            <div class="submenu-panel">
                <button class="build-btn" data-tool="road">Standard Road</button>
            </div>
        </div>

        <div class="category-wrapper">
            <button class="menu-category-btn dropdown-trigger">Services <span>▶</span></button>
            <div class="submenu-panel">
                <button class="build-btn placeholder" data-tool="police">Police Station</button>
                <button class="build-btn placeholder" data-tool="fire">Fire Station</button>
            </div>
        </div>

        <div class="category-wrapper">
            <button class="menu-category-btn dropdown-trigger">Transit <span>▶</span></button>
            <div class="submenu-panel">
                <button class="build-btn placeholder" data-tool="rail">Rail Line</button>
                <button class="build-btn placeholder" data-tool="airport">Airport</button>
            </div>
        </div>

        <div class="category-wrapper">
            <button class="menu-category-btn dropdown-trigger">Unique <span>▶</span></button>
            <div class="submenu-panel">
                <button class="build-btn placeholder" data-tool="stadium">Stadium</button>
            </div>
        </div>

        <div class="category-wrapper">
            <button class="menu-category-btn dropdown-trigger">⚡ Power <span>▶</span></button>
            <div class="submenu-panel">
                <button class="build-btn power-tool" data-tool="powerplant">Power Plant</button>
            </div>
        </div>

        <hr class="menu-divider">

        <div class="category-wrapper">
            <button class="menu-category-btn dropdown-trigger views-trigger">City Views <span>▶</span></button>
            <div class="submenu-panel">
                <button class="view-btn active" data-view="normal">Normal Map</button>
                <button class="view-btn" data-view="traffic">Traffic Data</button>
                <button class="view-btn" data-view="pollution">Pollution Map</button>
                <button class="view-btn" data-view="powergrid">Power Grid</button>
            </div>
        </div>
    </div>
        
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <input type="file" id="loadInputInGame" accept=".json" style="display: none;">
        <script type="module" src="js/main.js"></script>
    </body>
</html>
